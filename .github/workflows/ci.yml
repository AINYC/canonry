name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/setup/action.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'scripts/**'
      - 'skills/**'
      - 'plugins/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'docs/CODEMAP.md'
      - 'docs/GUARDS.md'
      - 'docs/DOC_UPDATE.md'
      - 'AGENTS.md'
  pull_request:
    # No `branches:` filter — run CI on every PR, including stacked PRs
    # targeting feature branches. This keeps each step of a stack green
    # without waiting until rebase-to-main.
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/setup/action.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'scripts/**'
      - 'skills/**'
      - 'plugins/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'docs/CODEMAP.md'
      - 'docs/GUARDS.md'
      - 'docs/DOC_UPDATE.md'
      - 'AGENTS.md'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: '**/*.tsbuildinfo'
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            tsbuildinfo-${{ runner.os }}-
      - run: pnpm run typecheck

  test_shards:
    name: test ${{ matrix.shard }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Deliberately asymmetric to keep CI cost down.
      #
      # Node 22 is what Docker and the published build pin, so it stays sharded
      # 4x for fast feedback on the version that actually ships.
      #
      # Node 26 is the highest major in `SUPPORTED_MAJORS`
      # (scripts/check-node.mjs) and the current Homebrew default. It runs the
      # WHOLE suite in ONE job: +1 runner instead of +4, still 100% coverage.
      # Sampling a single shard there would have been cheaper by the same
      # amount and would have covered a quarter of the suite — and the Node 26
      # break this matrix was added to catch (tsx's `module.register()` tripping
      # DEP0205) lives in packages/canonry, which one shard may not hold.
      #
      # The pairing is the point: better-sqlite3 is a NATIVE module, so a major
      # is only "supported" if its prebuilt binary resolves and loads.
      # `node-support-range.test.ts` asserts this matrix covers the highest
      # supported major, so the claim cannot drift from its evidence the way it
      # did while the guard sat at 25 for months.
      matrix:
        include:
          - { node: '22', shard: '1/4' }
          - { node: '22', shard: '2/4' }
          - { node: '22', shard: '3/4' }
          - { node: '22', shard: '4/4' }
          - { node: '26', shard: '1/1' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm run test --shard=${{ matrix.shard }}

  test:
    name: test
    needs: test_shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify all test shards succeeded
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more test shards failed"
            exit 1
          fi
          echo "All test shards passed"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bash scripts/check-docs.sh
        name: Check documentation coverage (AGENTS.md per package)
      - run: pnpm run lint

  # The WP plugin's PHP suite. It runs here and ONLY here: the root test
  # script is vitest-only, and wp-plugin-release.yml auto-publishes the plugin
  # zip on any merge that touches the plugin — so without this job a broken
  # plugin change would ship to client sites untested. ubuntu-latest bundles
  # PHP, and the suite is a dependency-free custom runner (no composer).
  wp-plugin-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: php --version
      - run: php test/run-tests.php
        working-directory: packages/wordpress-traffic-logger-plugin
        name: WordPress traffic-logger plugin suite

  ts-prune:
    # Lightweight dead-export check via npx (no heavy dep in repo). Reports unused exports not used outside their module; filtered to exclude "used in module" noise. Non-blocking — surfaces in logs without failing CI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx --yes ts-prune -p tsconfig.base.json -s ".*\\.test\\.ts" 2>&1 | tee /tmp/ts-prune.txt; echo "--- ts-prune (filtered) ---"; grep -v "used in module" /tmp/ts-prune.txt | head -n 50 || true
        name: Report unused exports (ts-prune, no heavy dep)

  codegen-drift:
    # Regenerates the hey-api client from the OpenAPI spec and fails if the
    # committed output differs. Run separately from `lint` so a stale client
    # surfaces as its own check name and a contributor knows to run
    # `pnpm --filter @ainyc/canonry-api-client gen` locally.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ainyc/canonry-api-client gen:check
        name: Verify generated API client matches OpenAPI spec

  plugin-drift:
    # The native plugin mirrors the canonical Canonry/Aero skills and package
    # version, and CODEMAP.md indexes key files. Fail with a focused check when a generated copy is stale, CODEMAP is stale, or a plugin-affecting change reuses the version already present on the base.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-advancement gate resolves the PR/push merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify native plugin assets are in sync
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$EVENT_BASE_SHA"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
          fi
          pnpm plugin:check --base-ref "$BASE_REF"

  version-guard:
    # Catches the release hazard CI is otherwise structurally blind to.
    #
    # `plugin:check --base-ref` already asserts the version advanced past the
    # MERGE BASE, i.e. past where the branch started. It cannot see main moving
    # underneath a long-lived PR. When it does, the branch still "advanced" and
    # the check passes, but after merge `publish.yml` compares HEAD against its
    # parent, finds the version unchanged, and SKIPS npm + Homebrew while Docker
    # still moves `latest`. A silent half-release, twice observed.
    #
    # So compare against the BASE BRANCH TIP, which is what the version will be
    # measured against after the merge lands.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version must still be releasable against the base branch tip
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          version_at() {
            git show "$1":packages/canonry/package.json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{console.log(JSON.parse(s).version??'')}catch{console.log('')}})"
          }

          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          HEAD_V=$(node -p "require('./packages/canonry/package.json').version")
          BASE_V=$(version_at "$MERGE_BASE")
          TIP_V=$(version_at "origin/$BASE_REF")

          echo "branch point: $BASE_V | base tip: $TIP_V | this PR: $HEAD_V"

          # No bump attempted. Legitimate for docs and small changes, and the
          # repo's versioning rule allows it, so nothing to check.
          if [ "$HEAD_V" = "$BASE_V" ]; then
            echo "No version bump in this PR — nothing to verify."
            exit 0
          fi

          # A bump WAS attempted. It has to still be a bump once merged.
          if [ "$(printf '%s\n%s\n' "$TIP_V" "$HEAD_V" | sort -V | tail -1)" != "$HEAD_V" ] || [ "$HEAD_V" = "$TIP_V" ]; then
            echo "::error::This PR bumps $BASE_V -> $HEAD_V, but $BASE_REF is already at $TIP_V."
            echo "::error::Merging would leave the version unchanged, so publish.yml would skip npm and Homebrew while Docker still moves 'latest'."
            echo "::error::Rebase onto $BASE_REF and bump past $TIP_V."
            exit 1
          fi

          # And it has to be a version nobody has taken.
          if npm view "@canonry/canonry@$HEAD_V" version >/dev/null 2>&1; then
            echo "::error::@canonry/canonry@$HEAD_V is already published to npm. Pick the next unused version."
            exit 1
          fi

          echo "OK: $HEAD_V is ahead of the base tip ($TIP_V) and unpublished."

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r run build
        name: Build all packages (catches missing deps, bundler errors)

  publish-smoke-test:
    # Catches the failure mode where a workspace dep leaks into runtime
    # `dependencies` (pnpm publish rewrites `workspace:*` → `0.0.0`,
    # which 404s on `npm install` because private workspace packages
    # aren't published). Packs canonry the same way the publish workflow
    # does and runs `npm install` against the tarball from a scratch
    # directory — exactly what external users do when they `npm i -g`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @canonry/canonry build
        name: Build canonry (required for pnpm pack)
      - name: Pack canonry tarball
        id: pack
        shell: bash
        run: |
          cd packages/canonry
          OUTPUT=$(pnpm pack --pack-destination /tmp)
          TARBALL=$(echo "$OUTPUT" | grep -E '\.tgz$' | tail -1)
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "pnpm pack did not produce a tarball" >&2
            echo "$OUTPUT" >&2
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Install canonry from tarball into scratch project
        shell: bash
        run: |
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y > /dev/null
          npm install "${{ steps.pack.outputs.tarball }}"
          ./node_modules/.bin/canonry --version

  validate:
    runs-on: ubuntu-latest
    needs: [typecheck, test, lint, ts-prune, codegen-drift, plugin-drift, build, publish-smoke-test, wp-plugin-tests]
    if: always()
    steps:
      - name: Verify all validate jobs succeeded
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.ts-prune.result }}" != "success" ] || \
             [ "${{ needs.codegen-drift.result }}" != "success" ] || \
             [ "${{ needs.plugin-drift.result }}" != "success" ] || \
             [ "${{ needs.wp-plugin-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.publish-smoke-test.result }}" != "success" ]; then
            echo "One or more validate jobs failed"
            exit 1
          fi
          echo "All validate jobs passed"

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Use the runner's bundled buildx/docker driver so CI doesn't have to pull
      # an extra BuildKit image from Docker Hub before the actual image build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: canonry:ci

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --rm --name canonry-ci -p 4100:4100 -e CANONRY_API_KEY=test canonry:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4100/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs canonry-ci
          exit 1

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f canonry-ci || true
