name: Publish @canonry/val-kit

# `@canonry/val-kit` is the shared host kit the Val Town Vals import at runtime.
# Publishing is manual, and stays manual, for two reasons:
#
#   1. It is outward-facing and hard to reverse. A public npm version is
#      immutable and visible to anyone; unpublishing is restricted and breaks
#      whoever already resolved it. That is an operator decision, not a merge
#      side effect.
#   2. It is the gate the deploys wait on. A Val cannot deploy until the exact
#      version it pins exists on npm (see deploy-ai-visibility-check.yml), so
#      the operator publishing the kit is the same person choosing to unblock
#      the deploy — in that order, deliberately.
#
# CI already validates the Vals against the workspace copy of the kit, so this
# workflow's job is narrower: prove the kit builds and passes its own checks,
# refuse a version npm already has, and publish.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-val-kit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build @canonry/val-kit
        run: pnpm --filter @canonry/val-kit build

      - name: Typecheck @canonry/val-kit
        run: pnpm --filter @canonry/val-kit run typecheck

      - name: Test @canonry/val-kit
        run: pnpm --filter @canonry/val-kit run test

      - name: Lint @canonry/val-kit
        run: pnpm --filter @canonry/val-kit run lint

      # npm versions are immutable, so publishing over one is not a mistake the
      # registry will let you correct — it just fails halfway through, after the
      # build. Check first, and say which file to edit.
      - name: Version must not already be published
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./packages/val-kit/package.json').version")

          if [ -z "$VERSION" ]; then
            echo "::error::packages/val-kit/package.json has no version."
            exit 1
          fi

          if npm view "@canonry/val-kit@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@canonry/val-kit@$VERSION is already published to npm."
            echo "::error::Bump the version in packages/val-kit/package.json, update the pins in every Val that imports it, then re-run this workflow."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @canonry/val-kit@$VERSION"

      # Same npm auth mechanism as publish.yml: setup-node writes the registry
      # auth line, `NODE_AUTH_TOKEN` fills it in from the NPM_TOKEN secret.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @canonry/val-kit publish --access public --no-git-checks
