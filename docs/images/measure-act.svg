<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title description">
  <title id="title">Canonry: your agent measures and acts</title>
  <desc id="description">Your agent uses Canonry through MCP, CLI, or REST API, with skills from the Agent Plugin. Canonry combines AI answers, citations, competitor comparisons, search analytics, site health, and server-side traffic with tools for content, WordPress, structured data, indexing submissions, and paused ChatGPT Ads. Advanced Measurement organizes properties and market groups, with questions, engines, models, and locations per property. Canonry sends webhook events to your systems, including automations, reporting, notifications, and agents. Canonry is open source and self-hosted with your provider keys.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#b71912"/>
    </marker>
  </defs>
  <rect width="1280" height="730" fill="#f7f8fa"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#202a38">
    <!-- Two external connections: agent tool access and outbound webhooks. -->
    <rect x="56" y="40" width="568" height="122" rx="8" fill="#202a38"/>
    <text x="84" y="91" font-size="32" font-weight="650" fill="#fff">Your agent</text>
    <text x="84" y="132" font-size="24" fill="#e0e5ec">Skills from the Agent Plugin</text>

    <rect x="792" y="40" width="432" height="122" rx="8" fill="#fff" stroke="#a8b0bd" stroke-width="1.5"/>
    <text x="820" y="91" font-size="30" font-weight="650">Your systems</text>
    <text x="820" y="132" font-size="22" fill="#566274">Automations · apps · agents</text>

    <!-- One platform, with measurement and action equally prominent. -->
    <rect x="56" y="222" width="1168" height="470" rx="10" fill="#fff" stroke="#8793a3" stroke-width="1.5"/>
    <path d="M66 222H1214Q1224 222 1224 232V304H56V232Q56 222 66 222Z" fill="#eef1f5"/>
    <path d="M56 304H1224" stroke="#b9c1cd" stroke-width="1.5"/>
    <text x="84" y="273" font-size="31" font-weight="650">Canonry</text>
    <text x="1196" y="271" text-anchor="end" font-size="23" fill="#566274">Open source · self-hosted · your provider keys</text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="25" font-weight="600" fill="#b71912">
      <text x="84" y="354">MEASURE</text>
      <text x="676" y="354">ACT</text>
    </g>
    <path d="M640 329V549" stroke="#d7dce3" stroke-width="1.5"/>

    <g font-size="24" fill="#465264">
      <text x="84" y="398">AI answers, citations + cited pages</text>
      <text x="84" y="440">Competitors + share of voice</text>
      <text x="84" y="482">Search analytics + site health</text>
      <text x="84" y="524">Server-side traffic</text>
      <text x="84" y="552" font-size="21">Crawler visits · AI fetches · referrals</text>

      <text x="676" y="398">Plan content + publish to WordPress</text>
      <text x="676" y="440">Deploy structured data</text>
      <text x="676" y="482">Submit sitemaps + URLs</text>
      <text x="676" y="524">Prepare paused ChatGPT Ads</text>
    </g>

    <path d="M84 579H1196" stroke="#d7dce3" stroke-width="1.5"/>
    <text x="84" y="620" font-size="24" font-weight="600">Advanced Measurement: properties + market groups</text>
    <text x="84" y="657" font-size="23" fill="#566274">Questions, engines, models + locations per property</text>
  </g>

  <g fill="none" stroke="#b71912" stroke-width="2.3" marker-end="url(#arrow)">
    <path d="M112 162V212"/>
    <path d="M1184 222V172"/>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" fill="#b71912">
    <text x="136" y="202">MCP · CLI · REST API</text>
    <text x="1158" y="202" text-anchor="end">Webhook events</text>
  </g>
</svg>
